<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maskerade - Raum-System</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; }
        
        /* Start-Screen */
        #login-screen { position: fixed; inset: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; gap: 15px; padding: 20px; text-align: center; }
        .input-group { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
        input, select { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; text-align: center; }
        input#roomcode-input { text-transform: uppercase; }
        label { text-align: left; font-size: 14px; color: #aaa; margin-bottom: -5px; }

        .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: white; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #007bff; }
        .divider { color: #666; font-size: 14px; margin: 10px 0; border-top: 1px solid #333; padding-top: 10px; }

        /* App-Layout (Kein Scrollen) */
        #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; overflow: hidden; }

        /* Header */
        #header { height: 50px; background: #181818; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
        .code-box { background: #222; border: 1px solid #ffc107; padding: 4px 10px; border-radius: 6px; font-weight: bold; color: #ffc107; letter-spacing: 2px; font-size: 16px; }
        #status-info { color: #aaa; font-size: 14px; }

        /* Grid für 2 bis 6 Spieler */
        #video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 12px; min-height: 0; overflow: hidden; background: #121212; }
        
        /* Karten-Slots für die Spieler */
        .slot-card { background: #1e1e1e; border: 2px dashed #333; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; min-height: 0; position: relative; }
        .slot-card.active { border: 2px solid #28a745; background: #1a1a1a; }
        
        /* Das kleine Feld für die Webcam oben */
        .webcam-box { width: 100%; flex: 1; min-height: 0; background: #000; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 6px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Avatar Icon + Name unter dem Videofeld */
        .player-info { display: flex; align-items: center; gap: 8px; background: #252525; padding: 6px 12px; border-radius: 20px; border: 1px solid #333; width: 100%; justify-content: center; }
        .user-icon { width: 26px; height: 26px; background: #007bff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; text-transform: uppercase; flex-shrink: 0; }
        .player-name { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .waiting-text { color: #666; font-size: 13px; font-style: italic; text-align: center; margin: auto; }

        /* Steuerleiste unten */
        #bottom-panel { background: #181818; border-top: 1px solid #333; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
        .cards-container { display: flex; justify-content: center; gap: 10px; }
        .card { background: #ff4757; color: white; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <!-- Start-Screen -->
    <div id="login-screen">
        <h2>Maskerade Lobby</h2>
        <div class="input-group">
            <input type="text" id="username-input" placeholder="Dein Name..." maxlength="15">
            
            <label for="max-players-select">Spieleranzahl für neuen Raum:</label>
            <select id="max-players-select">
                <option value="2">2 Spieler</option>
                <option value="3">3 Spieler</option>
                <option value="4" selected>4 Spieler</option>
                <option value="5">5 Spieler</option>
                <option value="6">6 Spieler</option>
            </select>
            
            <button class="btn btn-green" onclick="createRoom()">Neuen Raum erstellen</button>
            
            <div class="divider">ODER EINEM RAUM BEITRETEN</div>
            
            <input type="text" id="roomcode-input" placeholder="4-stelliger Raum-Code" maxlength="4">
            <button class="btn btn-blue" onclick="joinRoom()">Raum beitreten</button>
        </div>
    </div>

    <!-- Hauptansicht ohne Scrollen -->
    <div id="app">
        <div id="header">
            <div>
                <span style="font-weight: bold; font-size: 14px;">RAUM:</span>
                <span id="room-display" class="code-box">----</span>
            </div>
            <div id="status-info">Warte auf Verbindung...</div>
        </div>

        <div id="video-grid"></div>

        <div id="bottom-panel">
            <button id="start-btn" class="btn btn-green" onclick="startGame()">Karten neu geben</button>
            <div id="cards-container" class="cards-container">
                <span style="color: #666; font-size: 13px;">Noch keine Karten ausgegeben.</span>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream = null;
        const peers = {};
        const videoGrid = document.getElementById('video-grid');
        let currentRoomState = null;

        // Kamera und Mikrofon starten
        async function initCamera() {
            if (localStream) return true;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                });
                return true;
            } catch (err) {
                console.warn("Kamera/Mikrofon Zugriff abgelehnt oder nicht vorhanden:", err);
                return false;
            }
        }

        async function createRoom() {
            const name = document.getElementById('username-input').value.trim();
            const maxPlayers = document.getElementById('max-players-select').value;
            if (!name) return alert("Bitte gib einen Namen ein!");
            
            await initCamera();
            socket.emit('create-room', { username: name, maxPlayers: maxPlayers });
        }

        async function joinRoom() {
            const name = document.getElementById('username-input').value.trim();
            const code = document.getElementById('roomcode-input').value.trim();
            if (!name || !code) return alert("Bitte Name und Raum-Code eingeben!");
            
            await initCamera();
            socket.emit('join-room', { roomCode: code, username: name });
        }

        socket.on('room-joined', (data) => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('room-display').innerText = data.roomCode;
        });

        socket.on('error-msg', (msg) => {
            alert(msg);
        });

        // Warteraum & Plätze zeichnen
        socket.on('update-room-state', (data) => {
            currentRoomState = data;
            renderGrid();
        });

        function renderGrid() {
            if (!currentRoomState) return;
            const { maxPlayers, players } = currentRoomState;

            document.getElementById('status-info').innerText = `Spieler: ${players.length} / ${maxPlayers}`;
            videoGrid.innerHTML = '';

            for (let i = 0; i < maxPlayers; i++) {
                const player = players[i];
                const slot = document.createElement('div');

                if (player) {
                    slot.className = 'slot-card active';
                    slot.id = `slot-${player.id}`;

                    // 1. Webcam-Feld oben
                    const webcamBox = document.createElement('div');
                    webcamBox.className = 'webcam-box';
                    webcamBox.id = `webcam-${player.id}`;

                    // 2. Namens- & Icon-Leiste unten
                    const infoBar = document.createElement('div');
                    infoBar.className = 'player-info';
                    
                    const initial = player.name.charAt(0).toUpperCase();
                    const displayName = player.id === socket.id ? `${player.name} (Du)` : player.name;

                    infoBar.innerHTML = `
                        <div class="user-icon">${initial}</div>
                        <div class="player-name">${displayName}</div>
                    `;

                    slot.appendChild(webcamBox);
                    slot.appendChild(infoBar);

                    // Eigene Kamera einbinden
                    if (player.id === socket.id) {
                        if (localStream) {
                            const video = document.createElement('video');
                            video.srcObject = localStream;
                            video.autoplay = true;
                            video.playsInline = true;
                            video.muted = true; // Eigenen Ton stummschalten
                            webcamBox.appendChild(video);
                        } else {
                            webcamBox.innerHTML = `<span class="waiting-text">Kamera aus</span>`;
                        }
                    } else {
                        // Status-Text für Mitspieler
                        webcamBox.innerHTML = `<span class="waiting-text" id="peer-status-${player.id}">Verbinde Kamera...</span>`;
                        
                        // WebRTC-Verbindung starten
                        if (!peers[player.id]) {
                            createPeerConnection(player.id, player.name, true);
                        }
                    }
                } else {
                    // Leerer Platz im Warteraum
                    slot.className = 'slot-card';
                    slot.innerHTML = `<div class="waiting-text">Warte auf Spieler ${i + 1}...</div>`;
                }

                videoGrid.appendChild(slot);
            }
        }

        // WebRTC Signaling für Sprache & Video
        function createPeerConnection(targetId, targetName, isInitiator) {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            peers[targetId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => attachRemoteStream(targetId, event.streams[0]);
            pc.onicecandidate = (event) => {
                if (event.candidate) socket.emit('webrtc-ice-candidate', { target: targetId, candidate: event.candidate });
            };

            if (isInitiator) {
                pc.createOffer().then(offer => {
                    pc.setLocalDescription(offer);
                    socket.emit('webrtc-offer', { target: targetId, sdp: offer });
                });
            }
        }

        socket.on('webrtc-offer', async (data) => {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            peers[data.caller] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => attachRemoteStream(data.caller, event.streams[0]);
            pc.onicecandidate = (event) => {
                if (event.candidate) socket.emit('webrtc-ice-candidate', { target: data.caller, candidate: event.candidate });
            };

            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            socket.emit('webrtc-answer', { target: data.caller, sdp: answer });
        });

        socket.on('webrtc-answer', async (data) => {
            if (peers[data.responder]) {
                await peers[data.responder].setRemoteDescription(new RTCSessionDescription(data.sdp));
            }
        });

        socket.on('webrtc-ice-candidate', async (data) => {
            if (peers[data.sender]) {
                await peers[data.sender].addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function attachRemoteStream(peerId, stream) {
            const webcamBox = document.getElementById(`webcam-${peerId}`);
            if (webcamBox) {
                webcamBox.innerHTML = ''; // Vorherigen Platzhalter löschen
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                webcamBox.appendChild(video);
            }
        }

        socket.on('user-disconnected', (id) => {
            if (peers[id]) {
                peers[id].close();
                delete peers[id];
            }
        });

        function startGame() {
            socket.emit('start-game');
        }

        socket.on('your-cards', (cards) => {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            cards.forEach(cardName => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerText = cardName;
                container.appendChild(cardEl);
            });
        });
    </script>
</body>
</html>
