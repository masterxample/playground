<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klassenspiel</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --success-color: #22c55e;
      --danger-color: #ef4444;
      --border-color: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1, h2 {
      margin: 0 0 10px 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }

    .player-card {
      background-color: #0f172a;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      position: relative;
    }

    .player-card.active-turn {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    .position-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: var(--border-color);
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .action-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 8px;
      border: 2px solid transparent;
      color: white;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
    }

    /* Grün = Eigene Klasse */
    .action-btn.real-role {
      background-color: rgba(34, 197, 94, 0.15);
      border-color: var(--success-color);
      color: #4ade80;
    }

    /* Rot = Bluff */
    .action-btn.bluff-role {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: var(--danger-color);
      color: #f87171;
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border-color);
      color: #94a3b8;
      background-color: transparent;
    }

    .badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-real {
      background-color: var(--success-color);
      color: black;
    }

    .badge-bluff {
      background-color: var(--danger-color);
      color: white;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 10px 15px;
      border-radius: 6px;
    }

    #log-box {
      height: 120px;
      overflow-y: auto;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
    }

    .log-entry {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Klassenspiel</h1>

  <!-- Raumeröffnung & Lobbysteuerung -->
  <div class="card">
    <h2>Lobby & Spielstart</h2>
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <button id="start-game-btn" class="btn">🚀 Spiel starten (Raumeröffner)</button>
    </div>
    <div class="status-bar">
      <div>Status: <span id="game-status" style="font-weight: bold; color: var(--accent-color);">Warten auf Start</span></div>
      <div>Aktueller Zug: <span id="current-player-turn">-</span></div>
    </div>
  </div>

  <!-- Eigene Spielerübersicht -->
  <div class="card">
    <h2>Dein Profil</h2>
    <div style="display: flex; gap: 20px; align-items: center;">
      <div>Spieler: <strong id="my-name">Spieler 1 (Du)</strong></div>
      <div>Position: <strong id="my-position">-</strong></div>
      <div>Klasse: <span id="my-class-display">Noch keine</span></div>
    </div>
  </div>

  <!-- Aktionen (Nur wählbar, wenn man am Zug ist) -->
  <div class="card">
    <h2>Aktionen</h2>
    <p style="font-size: 14px; color: #94a3b8;">
      Grün = Entspricht deiner echten Klasse | Rot = <strong style="color: var(--danger-color);">Bluff</strong>
    </p>

    <div class="action-list" id="action-container">
      <!-- Dynamische Erzeugung der Aktions-Buttons -->
    </div>
  </div>

  <!-- Spielfeld / Mitspieler -->
  <div class="card">
    <h2>Sitzordnung / Reihenfolge</h2>
    <div class="player-grid" id="player-grid">
      <!-- Dynamisch befüllt -->
    </div>
  </div>

  <!-- Ereignis-Log -->
  <div class="card">
    <h2>Spielprotokoll</h2>
    <div id="log-box"></div>
  </div>
</div>

<script>
  // Definition der bestehenden/ursprünglichen Klassen inkl. Symbolen und Aktionen
  const CLASSES = {
    CLASS_A: { name: 'Klasse A', icon: '🛡️', actionText: 'Standard-Aktion A ausführen' },
    CLASS_B: { name: 'Klasse B', icon: '⚔️', actionText: 'Standard-Aktion B ausführen' },
    SWAPPER: { name: 'Karten-Tauscher', icon: '🔄', actionText: 'Karten / Klasse austauschen' }
  };

  // Spieler-Lobby
  let players = [
    { id: 1, name: 'Spieler 1 (Du)', isHost: true, classKey: null, position: null },
    { id: 2, name: 'Spieler 2', isHost: false, classKey: null, position: null },
    { id: 3, name: 'Spieler 3', isHost: false, classKey: null, position: null },
    { id: 4, name: 'Spieler 4', isHost: false, classKey: null, position: null }
  ];

  const myId = 1;
  let gameStarted = false;
  let currentTurnIndex = 0;

  // DOM Elemente
  const startGameBtn = document.getElementById('start-game-btn');
  const gameStatusEl = document.getElementById('game-status');
  const currentPlayerTurnEl = document.getElementById('current-player-turn');
  const myPositionEl = document.getElementById('my-position');
  const myClassDisplayEl = document.getElementById('my-class-display');
  const actionContainer = document.getElementById('action-container');
  const playerGrid = document.getElementById('player-grid');
  const logBox = document.getElementById('log-box');

  window.addEventListener('DOMContentLoaded', () => {
    updateUI();
  });

  // Nur der Raumeröffner kann das Spiel starten
  startGameBtn.addEventListener('click', () => {
    startNewGame();
  });

  function startNewGame() {
    gameStarted = true;
    log('Das Spiel wurde vom Raumeröffner gestartet!');

    // 1. Rollen/Klassen zufällig vergeben
    const classKeys = Object.keys(CLASSES);
    let pool = [...classKeys];

    players.forEach(player => {
      if (pool.length === 0) pool = [...classKeys];
      const randomIndex = Math.floor(Math.random() * pool.length);
      player.classKey = pool.splice(randomIndex, 1)[0];
    });

    // 2. Zufällige Positionen auslosen & Spieler danach sortieren
    const positions = Array.from({ length: players.length }, (_, i) => i + 1);
    shuffleArray(positions);

    players.forEach((player, index) => {
      player.position = positions[index];
    });

    // Sortierung nach Position
    players.sort((a, b) => a.position - b.position);

    currentTurnIndex = 0;
    gameStatusEl.textContent = 'Läuft';

    log('Klassen wurden verteilt & zufällige Sitzpositionen zugewiesen.');
    updateUI();
  }

  function getCurrentPlayer() {
    return players[currentTurnIndex];
  }

  function isMyTurn() {
    return gameStarted && getCurrentPlayer().id === myId;
  }

  // Aktion ausführen
  function executeAction(requiredClassKey) {
    if (!isMyTurn()) return;

    const me = players.find(p => p.id === myId);
    const requiredClass = CLASSES[requiredClassKey];
    const isBluff = me.classKey !== requiredClassKey;

    if (isBluff) {
      log(`⚠️ <strong>${me.name}</strong> führt als <span style="color: var(--danger-color)">BLUFF</span> die Aktion für <em>${requiredClass.icon} ${requiredClass.name}</em> aus!`);
    } else {
      log(`✅ <strong>${me.name}</strong> nutzt seine Klasse <em>${requiredClass.icon} ${requiredClass.name}</em>: <em>${requiredClass.actionText}</em>.`);
    }

    // Spezial-Aktion: Karten tauschen (Nur wenn man am Zug ist)
    if (requiredClassKey === 'SWAPPER') {
      const classKeys = Object.keys(CLASSES);
      const newClassKey = classKeys[Math.floor(Math.random() * classKeys.length)];
      me.classKey = newClassKey;
      log(`🔄 <strong>${me.name}</strong> hat seine Karten/Klasse ausgetauscht!`);
    }

    nextTurn();
  }

  function nextTurn() {
    currentTurnIndex = (currentTurnIndex + 1) % players.length;
    log(`Am Zug: ${getCurrentPlayer().name} (Pos. ${getCurrentPlayer().position})`);
    updateUI();
  }

  function updateUI() {
    const me = players.find(p => p.id === myId);

    // Profilanzeige
    if (me && me.classKey) {
      const cls = CLASSES[me.classKey];
      myClassDisplayEl.innerHTML = `${cls.icon} <strong>${cls.name}</strong>`;
      myPositionEl.textContent = me.position ? `Nr. ${me.position}` : '-';
    } else {
      myClassDisplayEl.textContent = 'Noch keine';
      myPositionEl.textContent = '-';
    }

    // Zuganzeige
    if (gameStarted) {
      const activePlayer = getCurrentPlayer();
      currentPlayerTurnEl.textContent = `Pos. ${activePlayer.position}: ${activePlayer.name}`;
      startGameBtn.disabled = true;
    } else {
      currentPlayerTurnEl.textContent = '-';
      startGameBtn.disabled = false;
    }

    // Aktionenliste anzeigen
    renderActions(me);

    // Spielfeld/Spieler anzeigen
    renderPlayerGrid();
  }

  function renderActions(me) {
    actionContainer.innerHTML = '';

    Object.keys(CLASSES).forEach(classKey => {
      const cls = CLASSES[classKey];
      const isMyClass = me && me.classKey === classKey;

      const btn = document.createElement('button');
      btn.className = `action-btn ${isMyClass ? 'real-role' : 'bluff-role'}`;
      btn.disabled = !isMyTurn();

      btn.innerHTML = `
        <div>
          <span>${cls.icon} ${cls.actionText}</span>
          <div style="font-size: 11px; opacity: 0.8; margin-top: 2px;">Benötigt: ${cls.name}</div>
        </div>
        <span class="badge ${isMyClass ? 'badge-real' : 'badge-bluff'}">
          ${isMyClass ? 'Echte Klasse' : 'Bluff'}
        </span>
      `;

      btn.addEventListener('click', () => executeAction(classKey));
      actionContainer.appendChild(btn);
    });
  }

  function renderPlayerGrid() {
    playerGrid.innerHTML = '';

    players.forEach(p => {
      const card = document.createElement('div');
      card.className = `player-card ${gameStarted && getCurrentPlayer().id === p.id ? 'active-turn' : ''}`;

      const isSelf = p.id === myId;
      const cls = p.classKey ? CLASSES[p.classKey] : null;
      const displayClass = isSelf && cls ? `${cls.icon} ${cls.name}` : '❓ Verdeckt';

      card.innerHTML = `
        <span class="position-badge">${p.position ? 'Pos. ' + p.position : 'Lobby'}</span>
        <div style="font-weight: bold; margin-bottom: 5px;">${p.name}</div>
        <div style="font-size: 13px; color: #94a3b8;">Klasse: ${displayClass}</div>
      `;

      playerGrid.appendChild(card);
    });
  }

  function log(message) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `> ${message}`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }
</script>
</body>
</html>
