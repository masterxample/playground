<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maskerade - Webcam Spielraum</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Login Screen */
        #login-screen { position: absolute; inset: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; gap: 15px; }
        #login-screen input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; text-align: center; }
        #login-screen button { padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; background: #28a745; color: white; cursor: pointer; }

        /* Main Game Layout */
        #game-screen { display: flex; flex-direction: column; height: 100%; }
        
        /* Video Grid */
        #video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; align-content: center; }
        .video-card { background: #222; border-radius: 10px; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .player-name { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 4px; font-size: 12px; }

        /* Secret Cards Area (Bottom) */
        #hand-area { background: #1e1e1e; padding: 15px; border-top: 2px solid #333; text-align: center; }
        .cards-container { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .card { background: #ff4757; color: white; padding: 15px 20px; border-radius: 8px; font-weight: bold; border: 2px solid #ffffff33; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 14px; }
        
        /* Controls */
        #controls { padding: 10px; background: #181818; display: flex; justify-content: center; gap: 10px; }
        button.action-btn { padding: 10px 16px; border-radius: 6px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Login ohne Account -->
    <div id="login-screen">
        <h2>Willkommen bei Maskerade</h2>
        <input type="text" id="username-input" placeholder="Dein Name..." maxlength="15">
        <button onclick="joinGame()">Spielraum betreten</button>
    </div>

    <!-- Spieloberfläche -->
    <div id="game-screen">
        <div id="video-grid"></div>

        <div id="controls">
            <button class="action-btn" onclick="startGame()">Karten neu geben</button>
        </div>

        <!-- Eigene Handkarten (Nur für mich sichtbar) -->
        <div id="hand-area">
            <h3>Deine geheimen Handkarten:</h3>
            <div id="cards-container" class="cards-container">
                <span style="color: #888;">Noch keine Karten ausgeteilt.</span>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream;
        const peers = {};
        const videoGrid = document.getElementById('video-grid');

        // Kamera & Mikrofon beim Start anfordern
        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                addVideoStream(socket.id, 'Du', localStream, true);
            } catch (err) {
                alert("Kamera/Mikrofon-Zugriff verweigert oder nicht verfügbar. Bitte im Browser erlauben.");
            }
        }

        function joinGame() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) return alert("Bitte gib einen Namen ein!");
            
            document.getElementById('login-screen').style.display = 'none';
            initCamera().then(() => {
                socket.emit('join-game', name);
            });
        }

        function startGame() {
            socket.emit('start-game');
        }

        // --- WebRTC Video Stream Logik ---
        function addVideoStream(peerId, name, stream, isMuted = false) {
            if (document.getElementById(`video-${peerId}`)) return;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.id = `video-${peerId}`;

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (isMuted) video.muted = true; // Eigenen Ton stummschalten

            const label = document.createElement('div');
            label.className = 'player-name';
            label.innerText = name;

            card.appendChild(video);
            card.appendChild(label);
            videoGrid.appendChild(card);
        }

        // Neue Spieler verbinden
        socket.on('update-players', (playerList) => {
            playerList.forEach(player => {
                if (player.id !== socket.id && !peers[player.id]) {
                    createPeerConnection(player.id, player.name, true);
                }
            });
        });

        function createPeerConnection(targetId, targetName, isInitiator) {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });
            peers[targetId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => {
                addVideoStream(targetId, targetName, event.streams[0]);
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc-ice-candidate', { target: targetId, candidate: event.candidate });
                }
            };

            if (isInitiator) {
                pc.createOffer().then(offer => {
                    pc.setLocalDescription(offer);
                    socket.emit('webrtc-offer', { target: targetId, sdp: offer });
                });
            }
        }

        socket.on('webrtc-offer', async (data) => {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            peers[data.caller] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => {
                addVideoStream(data.caller, 'Mitspieler', event.streams[0]);
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc-ice-candidate', { target: data.caller, candidate: event.candidate });
                }
            };

            await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            socket.emit('webrtc-answer', { target: data.caller, sdp: answer });
        });

        socket.on('webrtc-answer', async (data) => {
            if (peers[data.responder]) {
                await peers[data.responder].setRemoteDescription(new RTCSessionDescription(data.sdp));
            }
        });

        socket.on('webrtc-ice-candidate', async (data) => {
            if (peers[data.sender]) {
                await peers[data.sender].addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        socket.on('user-disconnected', (id) => {
            if (peers[id]) {
                peers[id].close();
                delete peers[id];
            }
            const el = document.getElementById(`video-${id}`);
            if (el) el.remove();
        });

        // --- Geheime Karten-Empfang (Nur für MICH) ---
        socket.on('your-cards', (cards) => {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            cards.forEach(cardName => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerText = cardName;
                container.appendChild(cardEl);
            });
        });
    </script>
</body>
</html>
