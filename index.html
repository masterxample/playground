<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maskenrat - Hofintrige & Bluff</title>
    <style>
        :root {
            --bg-color: #1a1829;
            --card-bg: #2a2640;
            --accent-gold: #e2b714;
            --text-light: #ece8e1;
            --danger-red: #d9534f;
            --success-green: #5cb85c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-gold);
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            font-style: italic;
            margin-bottom: 20px;
            color: #a09abc;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            background: rgba(0,0,0,0.2);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .setup-screen, .game-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hidden { display: none !important; }

        label { font-weight: bold; }

        input, select, button {
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }

        button {
            background-color: var(--accent-gold);
            color: #111;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover { background-color: #f7d038; }
        button:active { transform: scale(0.98); }

        .btn-danger { background-color: var(--danger-red); color: white; }
        .btn-danger:hover { background-color: #c9302c; }

        .player-status {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .active-player {
            border: 2px solid var(--accent-gold);
        }

        .card-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }

        .card {
            width: 120px;
            height: 160px;
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            user-select: none;
        }

        .card.hidden-card {
            background: #151320;
            border-color: #444060;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .log-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid #444060;
            border-radius: 6px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>MASKENRAT</h1>
    <div class="subtitle">Ein Spiel um Macht, Einfluss & Täuschung</div>

    <div id="game-container">
        <!-- SETUP SCREEN -->
        <div id="setup-screen" class="setup-screen">
            <h3>Spieler-Anzahl wählen (2 - 6 Spieler)</h3>
            <select id="player-count">
                <option value="2">2 Spieler</option>
                <option value="3">3 Spieler</option>
                <option value="4" selected>4 Spieler</option>
                <option value="5">5 Spieler</option>
                <option value="6">6 Spieler</option>
            </select>
            <button onclick="startGame()">Spiel Starten</button>
        </div>

        <!-- MAIN GAME SCREEN -->
        <div id="game-screen" class="game-screen hidden">
            <div id="players-overview"></div>

            <hr style="border-color: #444060; margin: 10px 0;">

            <div id="turn-indicator" style="text-align: center; font-size: 18px; font-weight: bold; color: var(--accent-gold);"></div>

            <!-- PASS AND PLAY PRIVACY OVERLAY -->
            <div id="privacy-box" style="text-align: center; padding: 20px; background: var(--card-bg); border-radius: 8px;">
                <p id="privacy-text">Gib das Gerät an Spieler 1 weiter!</p>
                <button onclick="revealHand()">Karten anzeigen</button>
            </div>

            <!-- ACTION & HAND AREA -->
            <div id="action-area" class="hidden">
                <div class="card-container" id="hand-cards"></div>

                <h4>Wähle deine Aktion:</h4>
                <div class="action-grid">
                    <button onclick="takeIncome()">Einkommen (+1 Münze)</button>
                    <button onclick="takeForeignAid()">Fremde Hilfe (+2 Münzen)</button>
                    <button onclick="playRole('Kanzlerin')">Kanzlerin (Steuer +3)</button>
                    <button onclick="playRole('Straßenräuber')">Straßenräuber (Raub 2 Münzen)</button>
                    <button onclick="playRole('Bluthund')">Bluthund (Anschlag: 3 M.)</button>
                    <button onclick="playRole('Spion')">Spion (Karten tauschen)</button>
                    <button onclick="doCoup()" class="btn-danger" style="grid-column: span 2;">Sturz (Zahle 7 Münzen, eliminiere Rolle)</button>
                </div>
            </div>

            <div class="log-box" id="game-log"></div>
        </div>
    </div>

    <script>
        const ROLES = ['Kanzlerin', 'Straßenräuber', 'Bluthund', 'Bodyguard', 'Spion'];
        let players = [];
        let deck = [];
        let currentPlayerIndex = 0;

        function log(msg) {
            const logBox = document.getElementById('game-log');
            logBox.innerHTML += `<div>> ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function createDeck() {
            deck = [];
            ROLES.forEach(role => {
                deck.push(role, role, role); // 3 Karten jeder Rolle
            });
            deck.sort(() => Math.random() - 0.5);
        }

        function startGame() {
            const count = parseInt(document.getElementById('player-count').value);
            createDeck();
            players = [];

            for (let i = 1; i <= count; i++) {
                players.push({
                    id: i,
                    name: `Spieler ${i}`,
                    coins: 2,
                    hand: [deck.pop(), deck.pop()],
                    alive: true
                });
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            log("Das Spiel hat begonnen! Jeder Spieler startet mit 2 Münzen.");
            updateUI();
        }

        function updateUI() {
            const overview = document.getElementById('players-overview');
            overview.innerHTML = '';

            players.forEach((p, idx) => {
                if (!p.alive) return;
                const div = document.createElement('div');
                div.className = `player-status ${idx === currentPlayerIndex ? 'active-player' : ''}`;
                div.innerHTML = `<span><strong>${p.name}</strong> (${p.hand.length} Einfluss)</span><span>💰 ${p.coins} Münzen</span>`;
                overview.appendChild(div);
            });

            const current = players[currentPlayerIndex];
            document.getElementById('turn-indicator').innerText = `${current.name} ist am Zug`;
            document.getElementById('privacy-text').innerText = `Gib das Gerät an ${current.name} weiter!`;

            document.getElementById('privacy-box').classList.remove('hidden');
            document.getElementById('action-area').classList.add('hidden');
        }

        function revealHand() {
            document.getElementById('privacy-box').classList.add('hidden');
            document.getElementById('action-area').classList.remove('hidden');

            const handContainer = document.getElementById('hand-cards');
            handContainer.innerHTML = '';

            const current = players[currentPlayerIndex];
            current.hand.forEach(role => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<strong>${role}</strong>`;
                handContainer.appendChild(card);
            });
        }

        function nextTurn() {
            do {
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            } while (!players[currentPlayerIndex].alive);

            updateUI();
        }

        function takeIncome() {
            const p = players[currentPlayerIndex];
            p.coins += 1;
            log(`${p.name} nimmt 1 Münze Einkommen. (Gesamt: ${p.coins})`);
            nextTurn();
        }

        function takeForeignAid() {
            const p = players[currentPlayerIndex];
            p.coins += 2;
            log(`${p.name} fordert 2 Münzen Fremde Hilfe.`);
            nextTurn();
        }

        function playRole(roleName) {
            const p = players[currentPlayerIndex];
            log(`${p.name} nutzt/blufft die Aktion der Rolle: **${roleName}**.`);
            
            if (roleName === 'Kanzlerin') p.coins += 3;
            if (roleName === 'Bluthund') {
                if (p.coins < 3) { alert("Nicht genug Münzen!"); return; }
                p.coins -= 3;
                log(`${p.name} zahlt 3 Münzen für einen Anschlag.`);
            }
            
            nextTurn();
        }

        function doCoup() {
            const p = players[currentPlayerIndex];
            if (p.coins < 7) {
                alert("Du brauchst mindestens 7 Münzen für einen Sturz!");
                return;
            }
            p.coins -= 7;
            log(`${p.name} führt einen Sturz durch (-7 Münzen)!`);
            nextTurn();
        }
    </script>
</body>
</html>
